# Render 部署配置
# 访问 https://render.com/docs/yaml 查看完整配置选项

services:
  - type: web
    name: dilpo-translate-api
    region: singapore
    plan: free
    rootDir: server
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: qwen
        sync: false  # 需要在 Render 控制台设置
